<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chuyển hướng – LMS EDU PRO</title>
  <link rel="stylesheet" href="style.css">

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="firebase-sync.js"></script>
</head>
<body>
  <script>
    // Generic dashboard redirect: send user to their role's dashboard
    const role = sessionStorage.getItem('role');
    const map = {admin:'admin-dashboard.html', teacher:'teacher-dashboard.html', student:'student-dashboard.html'};
    window.location.replace(role ? (map[role] || 'Index.html') : 'auth.html');
  </script>
</body>
</html>
