<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Đăng nhập - EduPro</title>
  <meta name="description" content="Đăng nhập vào hệ thống LMS Pro">
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="light">
  <header class="navbar">
    <a href="Index.html" class="logo">EduPro</a>
    <nav class="nav-links">
      <a class="nav-item" href="Index.html">Trang chủ</a>
      <a class="nav-item" href="login.html" class="active">Đăng nhập</a>
      <a class="nav-item" href="register.html">Đăng ký</a>
    </nav>
  </header>

  <main class="main-wrapper">
    <section class="dashboard-main" style="max-width:400px;margin:auto;">
      <h1>Đăng nhập</h1>
      <form id="loginForm">
        <div class="input-group"><label for="username">Tên đăng nhập</label><input type="text" id="username" required></div>
        <div class="input-group"><label for="role">Vai trò</label>
          <select id="role" required>
            <option value="" disabled selected>Chọn vai trò</option>
            <option value="admin">Quản trị viên</option>
            <option value="teacher">Giáo viên</option>
            <option value="student">Học sinh</option>
          </select>
        </div>
        <button type="submit" class="btn-solid">Đăng nhập</button>
      </form>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-content">
      <div class="footer-col"><h3>EduPro</h3><p>© 2026 EduPro. All rights reserved.</p></div>
    </div>
  </footer>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const role = document.getElementById('role').value;
      // In a real app you would verify credentials here.
      sessionStorage.setItem('role', role);
      // After login, go to the appropriate dashboard.
      const dashMap = {admin:'admin-dashboard.html', teacher:'teacher-dashboard.html', student:'student-dashboard.html'};
      window.location.href = dashMap[role] || 'dashboard.html';
    });
  </script>
</body>
</html>
